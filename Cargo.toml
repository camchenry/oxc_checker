[package]
name = "oxc_checker"
version = "0.1.0"
edition = "2024"

[lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"
# TODO(lints): Enable after documenting the existing public API.
# missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
checked_conversions = "deny"
cloned_instead_of_copied = "deny"
dbg_macro = "deny"
explicit_iter_loop = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
lossy_float_literal = "deny"
macro_use_imports = "deny"
manual_string_new = "deny"
mem_forget = "deny"
multiple_unsafe_ops_per_block = "deny"
needless_for_each = "deny"
redundant_else = "deny"
rest_pat_in_fully_bound_structs = "deny"
single_char_pattern = "deny"
stable_sort_primitive = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
# TODO(lints): Enable incrementally after addressing existing violations. Panic-related
# lints may need targeted test-only allowances where panics express test invariants.
# nursery = { level = "deny", priority = -1 }
# cargo = { level = "deny", priority = -1 }
expect_used = "deny"
# indexing_slicing = "deny"
# panic = "deny"
# unwrap_used = "deny"
# TODO(lints): Recommended pedantic lints that currently have violations.
# cast_possible_truncation = "deny"
# cast_precision_loss = "deny"
# cast_sign_loss = "deny"
# doc_markdown = "deny"
# elidable_lifetime_names = "deny"
# format_push_string = "deny"
# manual_let_else = "deny"
# match_same_arms = "deny"
# match_wildcard_for_single_variants = "deny"
# missing_errors_doc = "deny"
# must_use_candidate = "deny"
# needless_pass_by_value = "deny"
redundant_closure_for_method_calls = "deny"
return_self_not_must_use = "deny"
single_match_else = "deny"
unnecessary_wraps = "deny"

[features]
default = []
bench = []
allocation-stats = ["oxc_allocator/track_allocations"]
conformance = []
conformance-tsc = []

[dependencies]
oxc_ast = "0.142.0"
oxc_ast_visit = "0.142.0"
oxc_allocator =  "0.142.0"
oxc_cfg = "0.142.0"
oxc_data_structures = { version = "0.142.0", features = ["stack"] }
oxc_parser =  "0.142.0"
oxc_resolver = "11.19.1"
oxc_semantic = { version = "0.142.0", features = ["cfg"] }
oxc_span =  "0.142.0"
oxc_syntax = "0.142.0"
oxc_index = "5.0.0"
oxc_str = "0.142.0"
bitflags = "2.12.1"
simdutf8 = "0.1.5"
num-traits = "0.2.19"
rayon = "1.11.0"
terminal_size = "0.4.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "check_es5_lib"
harness = false

[[bench]]
name = "check_fixture"
harness = false

[[bench]]
name = "type_set"
harness = false

[[example]]
name = "type_counts"
path = "src/examples/type_counts.rs"

[[example]]
name = "type_check"
path = "src/examples/type_check.rs"

[profile.bench]
debug = true

[profile.release-with-debug]
inherits = "release"
debug = true
