[package]
name = "oxc_checker"
version = "0.1.0"
edition = "2024"

[features]
default = []
bench = []
allocation-stats = ["oxc_allocator/track_allocations"]
conformance = []
conformance-tsc = []

[dependencies]
oxc_ast = "0.132.0"
oxc_ast_visit = "0.132.0"
oxc_allocator =  "0.132.0"
oxc_parser =  "0.132.0"
oxc_resolver = "11.19.1"
oxc_semantic = { version = "0.132.0", features = ["cfg"] }
oxc_span =  "0.132.0"
oxc_syntax = "0.132.0"
oxc_index = "4.1.0"
oxc_str = "0.132.0"
bitflags = "2.12.1"
simdutf8 = "0.1.5"
num-traits = "0.2.19"
rayon = "1.11.0"
terminal_size = "0.4.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "check_es5_lib"
harness = false

[[bench]]
name = "type_set"
harness = false

[[example]]
name = "type_counts"
path = "src/examples/type_counts.rs"

[[example]]
name = "type_check"
path = "src/examples/type_check.rs"

[profile.bench]
debug = true

[profile.release-with-debug]
inherits = "release"
debug = true
