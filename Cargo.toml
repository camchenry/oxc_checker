[package]
name = "oxc_checker"
version = "0.1.0"
edition = "2024"

[lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"
# TODO(lints): Enable after documenting the existing public API.
# missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
multiple_unsafe_ops_per_block = "deny"
rest_pat_in_fully_bound_structs = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
# TODO(lints): Enable incrementally after addressing existing violations. Panic-related
# lints may need targeted test-only allowances where panics express test invariants.
# pedantic = { level = "deny", priority = -1 }
# nursery = { level = "deny", priority = -1 }
# cargo = { level = "deny", priority = -1 }
expect_used = "deny"
# indexing_slicing = "deny"
# panic = "deny"
# unwrap_used = "deny"

[features]
default = []
bench = []
allocation-stats = ["oxc_allocator/track_allocations"]
conformance = []
conformance-tsc = []

[dependencies]
oxc_ast = "0.142.0"
oxc_ast_visit = "0.142.0"
oxc_allocator =  "0.142.0"
oxc_cfg = "0.142.0"
oxc_data_structures = { version = "0.142.0", features = ["stack"] }
oxc_parser =  "0.142.0"
oxc_resolver = "11.19.1"
oxc_semantic = { version = "0.142.0", features = ["cfg"] }
oxc_span =  "0.142.0"
oxc_syntax = "0.142.0"
oxc_index = "5.0.0"
oxc_str = "0.142.0"
bitflags = "2.12.1"
simdutf8 = "0.1.5"
num-traits = "0.2.19"
rayon = "1.11.0"
terminal_size = "0.4.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "check_es5_lib"
harness = false

[[bench]]
name = "check_fixture"
harness = false

[[bench]]
name = "type_set"
harness = false

[[example]]
name = "type_counts"
path = "src/examples/type_counts.rs"

[[example]]
name = "type_check"
path = "src/examples/type_check.rs"

[profile.bench]
debug = true

[profile.release-with-debug]
inherits = "release"
debug = true
